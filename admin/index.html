<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITProGuy Admin</title>
<style>
:root{color-scheme:light;font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:32px 20px}header,.card{background:white;border:1px solid #e1e7f0;border-radius:14px;padding:22px;margin-bottom:18px}h1{margin:0 0 6px}h2{margin:0 0 14px;font-size:19px}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{font-size:26px;font-weight:700;margin-top:8px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf4;vertical-align:top;white-space:nowrap}th{color:#64748b;font-weight:600}button,select{font:inherit;padding:7px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}button{cursor:pointer}a{color:#175cd3}#notice{margin:14px 0;padding:12px;border-radius:8px;background:#eef4ff}
</style></head><body><main class="wrap">
<header><h1>ITProGuy Admin</h1><div class="muted">Owner view | customer activity and account records</div><div id="notice">Loading account data...</div><p class="muted">Invoices and checkout are not connected. This page shows stored payment and receipt records only.</p><button id="refresh">Refresh</button></header>
<section class="card"><h2>Overview</h2><div id="metrics" class="cards"></div></section>
<section class="card"><h2>Customer profiles</h2><div id="users" class="scroll"></div></section>
<section class="card"><h2>Sign-in history</h2><div id="logins" class="scroll"></div></section>
<section class="card"><h2>Payments and receipts</h2><div id="purchases" class="scroll"></div></section>
<section class="card"><h2>Customer requests</h2><div id="requests" class="scroll"></div></section>
<section class="card"><h2>Admin audit</h2><div id="audit" class="scroll"></div></section>
</main><script>
const $=s=>document.querySelector(s), esc=v=>v==null?'-':String(v), date=v=>v?new Date(Number(v)).toLocaleString():'-';
function table(root,rows,cols,render){const target=$(root);target.replaceChildren();if(!rows.length){target.textContent='No records yet.';return}const t=document.createElement('table'),head=document.createElement('tr');for(const c of cols){const th=document.createElement('th');th.textContent=c;head.append(th)}t.append(head);for(const row of rows){const tr=document.createElement('tr');for(const val of render(row)){const td=document.createElement('td');if(val instanceof Node)td.append(val);else td.textContent=esc(val);tr.append(td)}t.append(tr)}target.append(t)}
async function load(){const n=$('#notice');n.textContent='Loading account data...';try{const r=await fetch('/api/admin/overview',{credentials:'same-origin'});if(r.status===401){n.textContent='Sign in to ITProGuy, then refresh this page.';return}if(r.status===403){n.textContent='This account does not have owner admin access.';return}if(!r.ok)throw Error('Request failed');const d=await r.json();n.textContent='Data loaded at '+new Date().toLocaleString();$('#metrics').replaceChildren();for(const [label,value] of Object.entries({Customers:d.totals.users,'Payment records':d.totals.purchases,'Pending requests':d.totals.pendingRequests})){const c=document.createElement('div');c.className='card';const l=document.createElement('div');l.className='muted';l.textContent=label;const v=document.createElement('div');v.className='metric';v.textContent=value;c.append(l,v);$('#metrics').append(c)}
table('#users',d.users,['Email','Name','Created','First sign-in','Last sign-in','Trial seconds'],x=>[x.email,x.name,date(x.created_at),date(x.first_login),date(x.last_login),x.trial_seconds]);
table('#logins',d.logins,['Email','Provider','Time'],x=>[x.email,x.provider,date(x.at)]);
table('#purchases',d.purchases,['Email','Amount','Credit seconds','Remaining','Expires','Status','Receipt'],x=>{let receipt='-';if(x.receipt_url){const a=document.createElement('a');a.href=x.receipt_url;a.rel='noopener noreferrer';a.target='_blank';a.textContent='Open receipt';receipt=a}return [x.email,x.amount_cents==null?'-':(Number(x.amount_cents)/100).toFixed(2)+' '+(x.currency||''),x.seconds,x.remaining_seconds,date(x.expires),x.status,receipt]});
table('#requests',d.requests,['Email','Type','Reason','Created','Status','Update'],x=>{const s=document.createElement('select');for(const v of ['pending','reviewed','approved','declined']){const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=v===x.status;s.append(o)}const b=document.createElement('button');b.textContent='Save';b.addEventListener('click',async()=>{b.disabled=true;try{const q=await fetch('/api/admin/request-status',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({id:x.id,status:s.value})});if(!q.ok)throw Error('Update failed');await load()}catch{b.disabled=false;n.textContent='Could not update request status.'}});const box=document.createElement('span');box.append(s,document.createTextNode(' '),b);return [x.email,x.kind,x.reason,date(x.created_at),x.status,box]});
table('#audit',d.audit,['Time','Admin','Action','Record'],x=>[date(x.at),x.actor_email,x.action,x.target_id]);
}catch{n.textContent='Could not load admin data. Refresh and try again.'}}
$('#refresh').addEventListener('click',load);load();
</script></body></html>
